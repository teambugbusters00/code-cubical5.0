<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hackathon Board</title><style>body{font:16px system-ui;background:#101827;color:#eaf0ff;margin:30px}form{display:flex;gap:8px;flex-wrap:wrap}input,select,button{padding:10px;border-radius:8px;border:1px solid #43516a;background:#1b2940;color:white}.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:24px}.col{background:#18243a;padding:14px;border-radius:12px;min-height:220px}.task{background:#263954;padding:12px;border-radius:8px;margin:8px 0}</style></head><body><h1>Hackathon Team Board</h1><form id="form"><input id="task" placeholder="Task description" required><input id="owner" placeholder="Owner"><select id="status"><option>Backlog</option><option>In progress</option><option>Done</option></select><button>Add task</button></form><div class="board" id="board"></div><script src="app.js"></script></body></html>
